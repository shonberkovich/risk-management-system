<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RMIS - אין חיבור לרשת</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f4f6f8;
        font-family: "Segoe UI", Arial, sans-serif;
        color: #1e293b;
        text-align: center;
        padding: 24px;
        box-sizing: border-box;
      }
      .card {
        max-width: 360px;
      }
      .icon { font-size: 48px; margin-bottom: 8px; }
      h1 { font-size: 20px; margin: 0 0 8px; }
      p { font-size: 14px; color: #64748b; line-height: 1.6; }
      button {
        margin-top: 16px;
        background: #1e5b8a;
        color: #fff;
        border: none;
        border-radius: 8px;
        padding: 10px 20px;
        font-size: 14px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon">📡</div>
      <h1>אין חיבור לאינטרנט</h1>
      <p>הדף המבוקש אינו זמין ללא חיבור רשת. עמודים שכבר נצפו עשויים להיות זמינים מהמטמון המקומי.</p>
      <button onclick="location.reload()">נסה שוב</button>
    </div>
  </body>
</html>
