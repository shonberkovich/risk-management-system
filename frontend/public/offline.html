<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RMIS - אין חיבור לרשת</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(120% 80% at 50% -10%, #141a46 0%, #02030a 65%);
        font-family: "Segoe UI", Arial, sans-serif;
        color: #eef1ff;
        text-align: center;
        padding: 24px;
        box-sizing: border-box;
      }
      .card {
        max-width: 360px;
      }
      .icon { font-size: 48px; margin-bottom: 8px; }
      h1 { font-size: 26px; margin: 0 0 8px; letter-spacing: -0.02em; }
      p { font-size: 14px; color: #a3accf; line-height: 1.6; }
      button {
        margin-top: 16px;
        background: linear-gradient(120deg, #8b7bff, #4cc9f0 55%, #2ee6d6); box-shadow: 0 12px 30px -10px rgba(139,123,255,0.8); font-weight: 600;
        color: #fff;
        border: none;
        border-radius: 12px;
        padding: 10px 20px;
        font-size: 14px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon">📡</div>
      <h1>אין חיבור לאינטרנט</h1>
      <p>הדף המבוקש אינו זמין ללא חיבור רשת. עמודים שכבר נצפו עשויים להיות זמינים מהמטמון המקומי.</p>
      <button onclick="location.reload()">נסה שוב</button>
    </div>
  </body>
</html>
